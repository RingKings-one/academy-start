services:
  db:
    image: postgres:16-alpine
    container_name: academy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academy_secret}
      POSTGRES_DB: ${POSTGRES_DB:-academy_start}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-academy} -d ${POSTGRES_DB:-academy_start}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: academy_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "${API_HOST_PORT:-8002}:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    container_name: academy_bot
    restart: unless-stopped
    command: python -m app.bot.main
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  worker:
    build: .
    container_name: academy_worker
    restart: unless-stopped
    command: python -m app.worker.main
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
